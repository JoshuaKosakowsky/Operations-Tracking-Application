name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --locked python scripts/verify_repo.py
      - run: uv run --locked pytest

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.19
      - run: uv run --locked ruff check --output-format=github .

  browser:
    name: Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.19
      - run: uv run --locked --group browser python -m playwright install --with-deps chromium
      - run: uv run --locked --group browser python scripts/browser_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure
          path: results/browser/
          retention-days: 7
          if-no-files-found: ignore

  source_zip:
    name: Source ZIP startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      # No checkout: install and execute from the exact commit's GitHub archive.
      # No token/provider secrets are exposed to downloaded application code.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.19
      - name: Obtain checker from exact source commit
        id: source
        shell: bash
        run: |
          python - <<'PY'
          import io
          import os
          from pathlib import Path, PurePosixPath
          from urllib.request import urlopen
          import zipfile

          url = f"https://api.github.com/repos/{os.environ['SOURCE_REPOSITORY']}/zipball/{os.environ['SOURCE_SHA']}"
          destination = Path(os.environ['RUNNER_TEMP']) / 'ota-source-bootstrap'
          destination.mkdir()
          with urlopen(url, timeout=120) as response:
              archive = zipfile.ZipFile(io.BytesIO(response.read()))
          with archive:
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or '\\' in name or ':' in name:
                      raise RuntimeError('Unsafe source archive path')
              archive.extractall(destination)
          project, = [path for path in destination.iterdir() if path.is_dir()]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'project={project}', file=output)
          PY
      - name: Download and launch isolated GitHub ZIP
        shell: bash
        env:
          SOURCE_PROJECT: ${{ steps.source.outputs.project }}
        run: |
          cd "$SOURCE_PROJECT"
          uv run --locked python scripts/source_zip_check.py --repository "$SOURCE_REPOSITORY" --sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.source.outputs.project != ''
        with:
          name: source-zip-evidence
          path: |
            ${{ steps.source.outputs.project }}/results/source-zip/record.json
            ${{ steps.source.outputs.project }}/results/source-zip/server.log
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: test
    needs: [python, lint, browser, source_zip]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failures:
              raise SystemExit(str(failures))
          print('All Python, Ruff, browser and source-ZIP checks passed.')
          PY
