[project]
name = "operations-tracking-application"
version = "0.2.0"
description = "Operations Tracking Application: field crew workday and reports"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
browser = ["playwright>=1.50,<2"]
audit = ["pip-audit>=2.9,<3"]

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Correctness first. Formatting and import sorting are advisory.
select = ["E4", "E7", "E9", "F"]
